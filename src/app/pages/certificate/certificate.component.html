<div class="d-flex flex-column align-items-center">
  <div class="d-flex justify-content-between align-items-center certificate-menu w-100">
    <div routerLink="/" class="d-flex align-items-center btn-back">
      <i class="ph ph-arrow-left"></i>
      <p class="m-0">Voltar</p>
    </div>

    <app-secondary-button (click)="downloadCertificate()" phClass="ph ph-download-simple" buttonText="Download"></app-secondary-button>
  </div>

  @if (certificate) {
    <div #certificateContainer class="certificate d-flex justify-content-center align-items-center">
      <img class="medal-icon" src="certificate/certificate_ribbon.png" alt="ícone de medalha" />
      <div class="certificate-content">
        <img class="signature-img" src="certificate/certificate_signature.svg" alt="assinatura" />
        <div class="certificate-info d-flex flex-column align-items-center">
          <div class="certificate-title-group">
            <h1>CERTIFICADO DE CONCLUSÃO</h1>
            <p>Este certificado comprova que</p>
          </div>

          <p class="student-name">{{certificate.name}}</p>
          <div class="activity-list-group">
            <p class="activity-list-title">Concluiu com sucesso as seguintes atividades:</p>
            <p class="activity-list">{{certificate.activities.join(',')}}</p>
          </div>
        </div>
        <p class="issue-date">Emitido em {{certificate.issueDate}}</p>
      </div>
    </div>
  }
</div>
